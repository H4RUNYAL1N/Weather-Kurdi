// 🔹 Döviz API
const exchangeAPI = "https://api.exchangerate.host/latest?base=TRY&symbols=USD,EUR,GBP";

// 🔹 Hava durumu çekme
async function fetchWeather(city){
  try {
    const today = new Date().toISOString().split('T')[0];
    const tomorrow = new Date(Date.now()+24*60*60*1000).toISOString().split('T')[0];
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&daily=temperature_2m_mean,apparent_temperature_mean&current_weather=true&timezone=auto&start_date=${today}&end_date=${tomorrow}`;
    const res = await fetch(url);
    const data = await res.json();
    return data.current_weather || { temperature: "N/A", windspeed: "N/A" };
  } catch(e){
    console.error("Weather fetch error:", e);
    return { temperature: "N/A", windspeed: "N/A" };
  }
}

// 🔹 Döviz çek
async function fetchExchange(){
  try {
    const res = await fetch(exchangeAPI);
    const data = await res.json();
    return data.rates;
  } catch(e){
    console.error("Exchange fetch error:", e);
    return {};
  }
}

// 🔹 Şehir kartları
async function showCities(){
  const container = document.getElementById("cities");
  for(const city of cities){
    const weather = await fetchWeather(city);
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="city-name">${city.name}</div>
      <div class="temp">Temperature: ${weather.temperature}°C</div>
      <div class="temp">Wind Speed: ${weather.windspeed} m/s</div>
    `;
    container.appendChild(card);
  }
}

// 🔹 Döviz kartı
async function showExchange(){
  const container = document.getElementById("exchange");
  const rates = await fetchExchange();
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="city-name">Exchange Rates (TRY base)</div>
    <div class="temp">USD: ${rates.USD}</div>
    <div class="temp">EUR: ${rates.EUR}</div>
    <div class="temp">GBP: ${rates.GBP}</div>
  `;
  container.appendChild(card);
}

// Başlat
